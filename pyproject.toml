[project]
name = "speak-flow"
version = "1.1.6"
description = "Lightweight local and cloud speech-to-text desktop application"
readme = "README.md"
license = "GPL-3.0-only"
authors = [
    { name = "Khent Felary G Sanco", email = "khentplaysmoba@gmail.com" },
]
requires-python = ">=3.11, <3.13"
dependencies = [
    "kaldi-native-fbank==1.22.3",
    "numpy<2",
    "onnxruntime>=1.17.0,<2",
    "pyinstaller>=6.19.0",
    "requests>=2.28.1",
    "soundfile>=0.12.0",
    "transcribe-cpp==0.4.1",
]
