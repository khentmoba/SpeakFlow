<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" fill="none" role="img" aria-labelledby="title description">
  <title id="title">SpeakFlow</title>
  <desc id="description">Voice to text, right where you work. Local and cloud dictation for Windows. The mark is an amber voice waveform that settles into a white text caret.</desc>
  <rect width="1100" height="340" fill="#070707"/>
  <rect x="0.5" y="0.5" width="1099" height="339" stroke="#1A1A1A"/>
  <g transform="translate(637.38 -63.3) scale(0.877)">
    <path d="M 84 256 H 132 C 156 256 156 176 180 176 C 204 176 220 356 244 356 C 268 356 284 196 308 196 C 324 196 324 256 340 256" stroke="#FFB020" stroke-width="48" stroke-linecap="square" fill="none"/>
    <rect x="410" y="156" width="44" height="200" fill="#FFFFFF"/>
  </g>
  <g font-family="Bahnschrift, 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif">
    <text x="64" y="160" font-size="72" font-weight="600" letter-spacing="11.5" fill="#FFFFFF">SPEAKFLOW</text>
    <text x="66" y="208" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif" font-size="24" fill="#8A8A8A">Voice to text, right where you work.</text>
    <text x="67" y="248" font-size="13" font-weight="600" letter-spacing="4.4" fill="#8A8A8A">LOCAL + CLOUD DICTATION FOR WINDOWS</text>
  </g>
</svg>
